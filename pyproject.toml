[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tailsd"
version = "0.1.0"
description = "Manifest-driven terminal-span supervision masks and matched controls for AR-TTS"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
torch = ["torch>=2.1"]
test = ["torch>=2.1"]

[tool.setuptools.packages.find]
include = ["tailsd*"]
